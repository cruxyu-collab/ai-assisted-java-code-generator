[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assisted-java-code-generator"
version = "0.1.0"
description = "AI-Assisted Java Code Generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "openpyxl>=3.1.0",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "python-pptx>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
